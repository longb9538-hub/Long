<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi mẹ yêu 20/10</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--tx:#4a2a33;--ac:#e0537a;--soft:#fde1e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241218;--card:#33202a;--tx:#fbe6ec;--ac:#ff7a9f;--soft:#4a2a37}}
:root[data-theme="dark"]{--bg:#241218;--card:#33202a;--tx:#fbe6ec;--ac:#ff7a9f;--soft:#4a2a37}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:16px}
h1{text-align:center;color:var(--ac);font-size:26px;margin:8px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:0;border-radius:12px;background:var(--soft);color:var(--tx);font:inherit;font-size:14px}
nav button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 18px #0001;min-height:340px;position:relative}
.sec{display:none}.sec.on{display:block}
#letter{white-space:pre-wrap;font-family:Georgia,serif;font-size:17px}
#garden{height:340px;position:relative;overflow:hidden;border-radius:18px;background:var(--card);cursor:pointer}
.fl{position:absolute;font-size:34px;transform:translate(-50%,-50%) scale(0);animation:b .6s forwards}
@keyframes b{to{transform:translate(-50%,-50%) scale(1)}}
#msg{text-align:center;margin-top:10px;min-height:52px;color:var(--ac);font-weight:600}
.hint{opacity:.6;font-size:14px;text-align:center;position:absolute;top:10px;left:0;right:0}
.mem{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ph{width:84px;height:84px;border-radius:14px;background:var(--soft) center/cover;display:grid;place-items:center;font-size:30px;flex:none;cursor:pointer}
.mem p{margin:0;font-size:15px}.note{font-size:13px;opacity:.6;text-align:center}
.opt{display:block;width:100%;margin:8px 0;padding:11px;border:0;border-radius:12px;background:var(--soft);color:var(--tx);font:inherit;text-align:left}
.rs{color:var(--ac);font-weight:600;margin-top:10px}
.pt{position:fixed;top:-30px;pointer-events:none;animation:f linear forwards;z-index:0}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
main{position:relative;z-index:1}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{--bg:#fde8ec;--card:#fffaf6;--tx:#4b1830;--ac:#cf3d6a;--soft:#f9cfd9;--leaf:#6b9a72;--leaf2:#8dbb8f;--rule:#f0d6d9;--sky:#ffd3dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f0f19;--card:#2e1824;--tx:#fbe6ee;--ac:#ff7fa3;--soft:#43212f;--leaf:#3f6b4b;--leaf2:#2f5239;--rule:#4a2a39;--sky:#3a1a2c}}
:root[data-theme="dark"]{--bg:#1f0f19;--card:#2e1824;--tx:#fbe6ee;--ac:#ff7fa3;--soft:#43212f;--leaf:#3f6b4b;--leaf2:#2f5239;--rule:#4a2a39;--sky:#3a1a2c}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif}
h1{font:700 46px/1.1 "Dancing Script",cursive;margin:14px 0 2px}
.sub{text-align:center;margin:0 0 16px;opacity:.7;font-size:14px}
nav{background:var(--soft);padding:5px;border-radius:999px}
nav button{background:none;border-radius:999px;padding:9px 2px;font-size:13px;font-weight:600}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px #cf3d6a55}
.paper{position:relative;background:var(--card);border-radius:6px;padding:30px 22px 26px;min-height:440px;transform:rotate(-.6deg);box-shadow:0 10px 30px #4b183022;background-image:repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px);background-position:0 30px}
.tape{position:absolute;top:-11px;left:50%;width:96px;height:26px;margin-left:-48px;background:var(--soft);opacity:.9;transform:rotate(-3deg)}
#letter{font:600 22px/36px "Dancing Script",cursive;color:var(--tx)}
#garden{height:380px;background:linear-gradient(var(--sky),var(--card) 75%);box-shadow:0 10px 30px #4b183018}
#garden::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;z-index:5;background:radial-gradient(ellipse 60% 100% at 25% 100%,var(--leaf2) 0 98%,transparent 100%),radial-gradient(ellipse 60% 100% at 80% 100%,var(--leaf) 0 98%,transparent 100%)}
.fl{z-index:1}
.fl::after{content:"";position:absolute;left:50%;top:75%;width:3px;height:420px;margin-left:-1.5px;background:var(--leaf);z-index:-1;transform-origin:top;animation:g .7s both}
@keyframes g{from{transform:scaleY(0)}}
.hint{z-index:6;top:14px}
#msg{margin:14px auto 0;max-width:92%;padding:10px 16px;background:var(--ac);color:#fff;border-radius:6px;min-height:0;font-size:15px}
#msg:empty{display:none}
#mems{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:none;box-shadow:none;padding:6px;min-height:0}
.mem{display:block;background:#fffdf9;padding:10px 10px 12px;margin:0;box-shadow:0 6px 16px #4b183026;transform:rotate(-2deg);color:#4b1830}
.mem:nth-child(even){transform:rotate(2deg)}
.ph{width:100%;height:auto;aspect-ratio:1;border-radius:2px;margin-bottom:8px}
.mem p{font:600 18px/1.2 "Dancing Script",cursive}
#quiz{padding:24px 20px;border-radius:6px;min-height:300px}
#quiz b{display:block;font-size:19px;line-height:1.4;margin-bottom:10px}
.opt{background:none;border:1.5px solid var(--ac);border-radius:999px;padding:12px 18px}
.rs{font:700 22px/1.3 "Dancing Script",cursive}
#quiz h2{font:700 30px/1.2 "Dancing Script",cursive}
.pt{opacity:.6}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&display=swap">
<style>
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{--bg:#12050a;--card:#1e0a12;--tx:#fff0d6;--ac:#e8b84a;--soft:#3a0f1c;--leaf:#2f6b45;--leaf2:#1a3a28;--rule:#e8b84a22;--sky:#2a0a1c}
body{background:radial-gradient(ellipse 90% 380px at 50% -40px,#6a1230,transparent),var(--bg)}
h1{font:900 104px/1 "Playfair Display",serif;margin:18px 0 6px;background:linear-gradient(100deg,#9a6a1a 20%,#fff0b8 45%,#e8b84a 55%,#9a6a1a 80%) 100% 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s ease-out both}
@keyframes sh{to{background-position:0 0}}
.sub{display:flex;align-items:center;gap:12px;opacity:1;color:var(--ac);font:italic 600 16px "Playfair Display",serif;margin:0 0 22px}
.sub::before,.sub::after{content:"";height:1px;flex:1;background:var(--ac)}
nav{background:none;border:1px solid var(--ac);border-radius:0;padding:0;gap:0}
nav button{border-radius:0;color:var(--tx);font:700 13px "Playfair Display",serif;padding:12px 2px;border-right:1px solid var(--ac)}
nav button:last-child{border-right:0}
nav button.on{background:var(--ac);color:#12050a;box-shadow:none}
.card,#quiz{border-radius:0;border:1px solid var(--ac);box-shadow:0 0 40px #e8b84a18}
.paper{background:var(--card);background-image:none;border:1px solid var(--ac);outline:1px solid var(--ac);outline-offset:-8px;border-radius:0;transform:none;padding:42px 30px 30px;box-shadow:0 0 50px #e8b84a1f}
.tape{display:block;width:54px;height:54px;margin-left:-27px;top:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9254f,#7a0a22);transform:none;opacity:1;box-shadow:0 4px 12px #0008}
.tape::after{content:"Mẹ";display:grid;place-items:center;height:100%;font:700 17px "Playfair Display",serif;color:#ffe9a8}
#letter{font:600 23px/36px "Dancing Script",cursive;color:var(--tx)}
#garden{border-radius:0;border:1px solid var(--ac);background:linear-gradient(#0a0210,#3b0c26 80%);box-shadow:0 0 40px #e8b84a18}
#garden::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 40px,#ffe9a8,transparent),radial-gradient(1px 1px at 230px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 60px,#fff,transparent);background-size:340px 160px}
.fl{filter:drop-shadow(0 0 10px #e8b84a)}
.fl::after{background:#3f8f5a}
.hint{color:var(--tx)}
#msg{background:none;border:1px solid var(--ac);border-radius:0;color:var(--ac);font:italic 600 17px/1.4 "Playfair Display",serif;padding:12px 16px}
.mem,.mem:nth-child(even){background:var(--card);border:1px solid var(--ac);outline:1px solid var(--ac);outline-offset:-5px;padding:12px;color:var(--tx);box-shadow:0 0 18px #e8b84a1f;transform:none}
.ph{border-radius:0;border:1px solid var(--rule)}
.mem p{font:italic 600 15px/1.3 "Playfair Display",serif}
#quiz b{font:700 20px/1.4 "Playfair Display",serif}
.opt{border-radius:0;color:var(--tx);border:1px solid var(--ac)}
.opt:hover{background:var(--ac);color:#12050a}
.rs{color:var(--ac)}
#quiz h2{color:var(--ac);font:900 28px/1.2 "Playfair Display",serif}
#gate{position:fixed;inset:0;z-index:100;display:flex}
#gate .h{flex:1;background:#12050a;transition:transform 1.2s cubic-bezier(.7,0,.2,1)}
#gate .h:first-child{margin-right:-1px}
#gate.open .h:first-child{transform:translateX(-101%)}
#gate.open .h:last-child{transform:translateX(101%)}
#gate .c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:20px;padding:24px;background:radial-gradient(circle at 50% 46%,#5a0f2699,transparent 62%);transition:opacity .4s}
#gate.open .c{opacity:0;pointer-events:none}
#gate.done{display:none}
#gate .k{font-size:72px;filter:drop-shadow(0 0 18px #e8b84a)}
#gate p{font:italic 600 19px/1.6 "Playfair Display",serif;color:var(--ac);margin:0}
#gate button{font:700 16px "Playfair Display",serif;padding:14px 38px;background:none;color:var(--ac);border:1px solid var(--ac);border-radius:0;cursor:pointer}
#gate button:hover{background:var(--ac);color:#12050a}
.crown{display:block;text-align:center;font-size:42px;margin-top:8px;filter:drop-shadow(0 0 14px #e8b84a)}
.sp{position:fixed;z-index:101;width:6px;height:6px;border-radius:50%;background:#ffd36a;pointer-events:none;box-shadow:0 0 8px #ffd36a}
nav button{font-size:12px;white-space:nowrap;padding:12px 0}
#vouchers{display:grid;gap:14px}
.vc{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ac);outline:1px solid var(--ac);outline-offset:-5px;padding:18px 20px;cursor:pointer;color:var(--tx);font:inherit;overflow:hidden}
.vc b{display:block;font:700 18px/1.3 "Playfair Display",serif;color:var(--ac);padding-right:90px}
.vc span{display:block;font-size:14px;opacity:.85;padding-right:90px}
.vc.used{cursor:default}
.vc.used b,.vc.used span{opacity:.4}
.vc.used::after{content:"ĐÃ DÙNG";position:absolute;right:14px;top:50%;border:3px solid #e0345c;color:#e0345c;font:900 18px "Playfair Display",serif;padding:2px 8px;transform:translateY(-50%) rotate(-12deg)}
.vc.new::after{animation:st .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes st{from{transform:translateY(-50%) rotate(-12deg) scale(2.6);opacity:0}}
.vid{border:1px solid var(--ac);outline:1px solid var(--ac);outline-offset:-5px;padding:12px;margin-bottom:18px;background:var(--card);box-shadow:0 0 18px #e8b84a1f}
.vid video{display:block;width:100%;max-height:70vh;background:#000;object-fit:contain}
.vid p{margin:10px 0 0;font:italic 600 15px/1.3 "Playfair Display",serif;text-align:center}
.mem:last-child:nth-child(odd){grid-column:1/-1;width:50%;margin:0 auto}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:50;width:42px;height:42px;border:1px solid var(--ac);background:var(--bg);color:var(--ac);font-size:18px;border-radius:0;cursor:pointer}
</style></head><body><div id="gate"><div class="h"></div><div class="h"></div><div class="c"><div class="k">👑</div><p>Một món quà nhỏ<br>dành tặng người phụ nữ <br>quan trọng nhất đời con</p><button id="go">Mở ra</button></div></div>
<main>
<span class="crown">👑</span><h1>Mẹ</h1><p class="sub">Nữ hoàng của con, ngày 20/10</p>
<nav><button class="on" data-t="a">💌 Thiệp</button><button data-t="b">🌹 Hoa</button><button data-t="c">📷 Ảnh</button><button data-t="e">🎫 Phiếu</button><button data-t="d">❓ Quiz</button></nav>

<section id="a" class="sec on"><div class="paper"><i class="tape"></i><div id="letter"></div></div></section>

<section id="b" class="sec"><div id="garden"><div class="hint">Chạm vào vườn để hoa nở nhé mẹ 🌷</div></div><div id="msg"></div></section>

<section id="c" class="sec"><div class="card" id="mems"></div><p class="note">Chạm vào ô vuông để thêm ảnh của hai mẹ con</p></section>

<section id="d" class="sec"><div class="card" id="quiz"></div></section>
<section id="e" class="sec"><div id="vouchers"></div><p class="note">Chạm vào phiếu để dùng. Mỗi phiếu chỉ dùng được một lần!</p></section>
</main>
<script>
// ===== SỬA Ở ĐÂY =====
const MOM="Mẹ", ME="Con";
const LETTER=`${MOM} ơi,\n\nNhân ngày 20/10, con muốn nói điều mà ngày thường con hay ngại nói: con thương ${MOM} nhiều lắm.\n\nCảm ơn ${MOM} vì đã lo cho con từng bữa cơm, từng giấc ngủ, và chưa bao giờ bỏ cuộc với con.\n\nCon chưa giỏi nói lời yêu thương, nên con viết bằng code, ngôn ngữ con giỏi nhất. Mong ${MOM} luôn khỏe và thật nhiều niềm vui.\n\n${ME} của ${MOM} 💕`;
const REASONS=["Vì mẹ luôn nấu món con thích","Vì mẹ luôn lo con ăn đã no chưa","Vì mẹ luôn tin con","Vì mẹ thức khuya chờ con về","Vì nụ cười của mẹ làm con an tâm","Vì mẹ là người hiểu con nhất","Vì mẹ chưa bao giờ giận con lâu","Con thương mẹ nhiều lắm!"];
const MEMS=["Ngày con còn bé xíu","Hai mẹ con mình, một ngày nắng đẹp","Con cười tít mắt, bé xíu thế này","Sinh nhật con tuổi 7","Con đeo balo nhỏ xíu, ra dáng lắm"];
const QUIZ=[
 {q:"Món con thích nhất mẹ nấu là gì?",o:[["Canh chua","Mẹ nhớ rồi, mai mẹ nấu nhé!"],["Thịt kho","Đúng vị mẹ kho là số 1!"],["Món nào mẹ nấu cũng ngon","Đáp án chuẩn nhất!"]]},
 {q:"Con hay làm gì khiến mẹ lo nhất?",o:[["Về trễ","Con xin lỗi, lần sau con báo mẹ!"],["Quên ăn","Con hứa ăn đúng bữa!"],["Thức khuya","Con sẽ đi ngủ sớm, thật đó!"]]},
 {q:"Con muốn nói gì với mẹ nhất?",o:[["Cảm ơn mẹ","Mẹ không cần cảm ơn đâu con."],["Con thương mẹ","Mẹ cũng thương con nhiều lắm."],["Cả hai!","Con nói đúng rồi đó."]]}];
// ======================
const $=s=>document.querySelector(s);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button,.sec").forEach(e=>e.classList.remove("on"));
 b.classList.add("on");$("#"+b.dataset.t).classList.add("on");
 if(b.dataset.t==="a")type();
});
let tm;function type(){clearTimeout(tm);const el=$("#letter");el.textContent="";let i=0;
 (function s(){el.textContent=LETTER.slice(0,++i);if(i<LETTER.length)tm=setTimeout(s,45)})()}
type();
// hoa rơi
setInterval(()=>{const p=document.createElement("div");p.className="pt";p.textContent=["✨","🌹","✨","🏵️"][Math.random()*4|0];
 p.style.left=Math.random()*100+"vw";p.style.fontSize=14+Math.random()*16+"px";p.style.animationDuration=6+Math.random()*5+"s";
 document.body.appendChild(p);setTimeout(()=>p.remove(),11000)},600);
// vườn hoa
let n=0;$("#garden").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),f=document.createElement("div");
 f.className="fl";f.textContent=["🌹","🌹","🌺","🏵️","🌹"][Math.random()*5|0];
 f.style.left=e.clientX-r.left+"px";f.style.top=e.clientY-r.top+"px";e.currentTarget.appendChild(f);
 $("#msg").textContent=REASONS[n++%REASONS.length]};
// kỷ niệm
$("#mems").innerHTML=MEMS.map((t,i)=>`<div class="mem"><div class="ph" data-i="${i}">🖼️</div><p>${t}</p></div>`).join("");

// quiz
let qi=0;function showQ(){const c=$("#quiz");
 if(qi>=QUIZ.length){c.innerHTML=`<h2 style="color:var(--ac)">Dù đáp án nào, mẹ vẫn hiểu con nhất 💖</h2><p>Chúc mẹ 20/10 thật vui, thật khỏe. Con yêu mẹ!</p><button class="opt" id="rs">Chơi lại</button>`;$("#rs").onclick=()=>{qi=0;showQ()};return}
 const x=QUIZ[qi];c.innerHTML=`<b>${qi+1}/${QUIZ.length}. ${x.q}</b>`+x.o.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")+`<div class="rs"></div>`;
 c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{c.querySelector(".rs").textContent=x.o[b.dataset.i][1];
 c.querySelectorAll(".opt").forEach(z=>z.onclick=null);setTimeout(()=>{qi++;showQ()},1600)})}
showQ();
$("#go").onclick=()=>{
 try{const a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime;
 [[261.6,0],[329.6,.18],[392,.36],[523.3,.54],[659.3,.54],[784,.54]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;
 g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.05);g.gain.exponentialRampToValueAtTime(.001,t+d+1.6);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+1.7)})}catch(e){}
 startMusic();const g=$("#gate");g.classList.add("open");
 for(let i=0;i<40;i++){const s=document.createElement("i");s.className="sp";s.style.left="50vw";s.style.top="50vh";document.body.appendChild(s);
 const an=Math.random()*6.28,d=80+Math.random()*220;s.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(an)*d}px,${Math.sin(an)*d}px)`,opacity:0}],{duration:1200+Math.random()*800,easing:"ease-out"}).onfinish=()=>s.remove()}
 const h=$("h1");h.style.animation="none";h.offsetWidth;h.style.animation="";
 setTimeout(()=>g.classList.add("done"),1400)};
// phiếu đặc quyền (sửa ở đây)
const VC=[["Phiếu miễn rửa chén","Mẹ nghỉ rửa chén một tuần, con lo hết."],["Phiếu bữa tối của mẹ","Con dắt mẹ đi ăn món mẹ chọn."],["Phiếu massage vai","Một buổi đấm bóp vai, mẹ chỉ việc nằm."],["Phiếu nghe con kể chuyện","Con kể chuyện cả buổi, không nhìn điện thoại."],["Phiếu một điều ước","Mẹ ước gì trong khả năng của con, con làm."]];
let used=[],last=-1;try{used=JSON.parse(localStorage.getItem("vc20")||"[]")}catch(e){}
function vcs(){$("#vouchers").innerHTML=VC.map((v,i)=>`<button class="vc${used.includes(i)?" used":""}${i===last?" new":""}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join("");
 document.querySelectorAll(".vc").forEach((b,i)=>b.onclick=()=>{if(used.includes(i))return;used.push(i);last=i;try{localStorage.setItem("vc20",JSON.stringify(used))}catch(e){}vcs()})}
vcs();
// nhạc nền vui nhộn, lặp vô tận
let M={};
function startMusic(){
 if(M.a)return;
 const a=M.a=new (window.AudioContext||window.webkitAudioContext)();a.resume();
 const out=a.createGain();out.gain.value=.5;out.connect(a.destination);
 const nb=a.createBuffer(1,a.sampleRate*.05,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const F=(s,b)=>b*2**(s/12);
 const T=(f,t,l,ty,v)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+l);o.connect(g);g.connect(out);o.start(t);o.stop(t+l+.05)};
 const R=[[0,[0,4,7]],[7,[0,4,7]],[9,[0,3,7]],[5,[0,4,7]]];
 const ML=[[7,7,4,7,9,7,4,null],[7,9,11,9,7,5,2,null],[4,4,9,9,7,4,0,null],[5,9,12,9,7,5,4,2]];
 const st=60/132/2;let s=0,nt=a.currentTime+1.4;
 const P=(s,t)=>{const bar=(s>>3)&3,i=s&7,[r,iv]=R[bar];
  if(i===0||i===4)T(F(r,130.81),t,st*3.5,"triangle",.5);
  if(i===2||i===6)iv.forEach(x=>T(F(r+x,261.63),t,st*1.4,"square",.035));
  const m=ML[bar][i];if(m!=null)T(F(m,523.25),t,st*1.6,"square",.05);
  if(i&1){const n=a.createBufferSource(),g=a.createGain();n.buffer=nb;g.gain.value=.05;n.connect(g);g.connect(out);n.start(t)}};
 setInterval(()=>{while(nt<a.currentTime+.3){P(s,nt);nt+=st;s++}},80);
 const b=document.createElement("button");b.id="snd";b.textContent="🔊";document.body.appendChild(b);
 M.mute=false;M.vid=false;
 const ap=()=>{out.gain.value=(M.mute||M.vid)?0:.5};
 b.onclick=()=>{M.mute=!M.mute;b.textContent=M.mute?"🔇":"🔊";ap()};
 const v=document.querySelector("video");
 if(v){v.onplay=()=>{M.vid=true;ap()};v.onpause=v.onended=()=>{M.vid=false;ap()}}
 document.addEventListener("visibilitychange",()=>document.hidden?a.suspend():a.resume());
}
</script></body></html>
